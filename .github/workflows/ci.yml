name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cross-repo drift guard reads engine PROPERTY_ENTITY_TYPES from source.
      - name: Checkout hauska-engine (drift-test truth)
        uses: actions/checkout@v4
        with:
          repository: empressaioemail-tech/hauska-engine
          path: _engine_truth
          sparse-checkout: |
            packages/atoms/src/property-instances.ts
          sparse-checkout-cone-mode: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test
        env:
          HAUSKA_ENGINE_PROPERTY_INSTANCES_PATH: ${{ github.workspace }}/_engine_truth/packages/atoms/src/property-instances.ts
        run: npm test

  ci-deny-as-no-atom-found:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if access-deny masquerades as corpus miss
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          src = Path("src/tools.ts").read_text(encoding="utf-8")
          needle = "No atom found at DID"
          hits = []
          for m in re.finditer(r"if\s*\(\s*!assertAtomReadable\(", src):
              i = src.find("{", m.end())
              if i < 0:
                  continue
              depth = 0
              j = i
              while j < len(src):
                  if src[j] == "{":
                      depth += 1
                  elif src[j] == "}":
                      depth -= 1
                      if depth == 0:
                          j += 1
                          break
                  j += 1
              block = src[m.start():j]
              if needle in block:
                  hits.append(src[:m.start()].count("\n") + 1)
          if hits:
              print("ci-deny-as-no-atom-found FAIL: pattern 'No atom found at DID' inside !assertAtomReadable branches at lines", hits)
              sys.exit(1)
          print("ci-deny-as-no-atom-found OK")
          PY

  ci-hardcoded-did-type-union:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail leftover DID type-union regexes
        run: |
          # Exact SWEEP pattern: did:hauska:\(\?:  in src/**
          if grep -R -n -E 'did:hauska:\(\?:' src; then
            echo "ci-hardcoded-did-type-union FAIL: leftover did:hauska:(?: type union in src/"
            exit 1
          fi
          echo "ci-hardcoded-did-type-union OK"

  ci-gate-map-vs-server-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set-equal server.tool names vs PUBLIC∪CODEX∪MAP∪REPORTING
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          tools_src = Path("src/tools.ts").read_text(encoding="utf-8")
          registered = re.findall(r'server\.tool\(\s*"([^"]+)"', tools_src)
          if not registered:
              print("ci-gate-map-vs-server-tool FAIL: no server.tool first-arg names extracted")
              sys.exit(1)
          gates_src = Path("src/product-gates.ts").read_text(encoding="utf-8")
          union: set[str] = set()
          for name in ("PUBLIC_CATALOG_TOOLS", "CODEX_TOOLS", "MAP_TOOLS", "REPORTING_TOOLS"):
              m = re.search(rf'(?:export\s+)?const {name} = new Set\(\[(.*?)\]\)', gates_src, re.S)
              if not m:
                  print(f"ci-gate-map-vs-server-tool FAIL: {name} set not found")
                  sys.exit(1)
              union.update(re.findall(r'"([^"]+)"', m.group(1)))
          remainder = sorted(set(registered) - union)
          stale = sorted(union - set(registered))
          if remainder or stale:
              if remainder:
                  print("ci-gate-map-vs-server-tool FAIL remainder (server.tool not in sets):", remainder)
              if stale:
                  print("ci-gate-map-vs-server-tool FAIL stale (sets not in server.tool):", stale)
              sys.exit(1)
          print(f"ci-gate-map-vs-server-tool OK ({len(registered)} tools)")
          PY

  ci-dual-atom-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail dual @hauska + @empressaio atom-contract
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          deps = {**pkg.get("dependencies", {}), **pkg.get("devDependencies", {})}
          has_hauska = "@hauska/atom-contract" in deps
          has_emp = "@empressaio/atom-contract" in deps
          if has_hauska and has_emp:
              print("ci-dual-atom-contract FAIL: both @hauska/atom-contract and @empressaio/atom-contract declared in package.json")
              sys.exit(1)
          src_hits = []
          for p in Path("src").rglob("*"):
              if p.suffix not in {".ts", ".js", ".mjs"}:
                  continue
              text = p.read_text(encoding="utf-8")
              if "@hauska/atom-contract" in text:
                  src_hits.append(str(p).replace("\\", "/"))
          if src_hits:
              print("ci-dual-atom-contract FAIL: @hauska/atom-contract still in src/**:", src_hits)
              sys.exit(1)
          if has_hauska:
              print("ci-dual-atom-contract FAIL: package.json still declares @hauska/atom-contract")
              sys.exit(1)
          print("ci-dual-atom-contract OK")
          PY
